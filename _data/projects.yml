# Projects
# uncomment the urls if you wish to display them, and add your own URL

- project: Constraining dark matter properties with self-annihilating dark matter admixed white dwarfs
  duration: Aug 2023 &mdash; Sept 2026
  description: Supervisors&#58; <a href="https://wp.phy.cuhk.edu.hk/teaching-staff/chu-ming-chung/" itemprop="url" target="_blank">Prof. M.-C. Chu</a>, <a href="https://wp.phy.cuhk.edu.hk/teaching-staff/lin-lap-ming/" itemprop="url" target="_blank">Dr. L.-M. Lin</a><ul class="resume-item-list"><li>Derive framework for white dwarfs partially-sustained by photon pressure sourcing from dark matter self-annihilation in hydrostatic balance</li><li>Study the stable structure configuration of white dwarfs with self-annihilating dark matter admixed</li><li>Constrain the dark matter interaction rate and particle mass by comparing the observed white dwarf mass-radius relationship with the simulated one</li></ul>

- project: Testing Stability and Asteroseismology of Bosonic Dark Matter Admixed White Dwarfs with Variable Scattering Length
  duration: May 2022 &mdash; Oct 2023
  description: <a href="images/BDAWD.pdf" itemprop="url" target="_blank">Final Year Project Report</a><br>Supervisor&#58; <a href="https://wp.phy.cuhk.edu.hk/teaching-staff/chu-ming-chung/" itemprop="url" target="_blank">Prof. M.-C. Chu</a><ul class="resume-item-list"><li>Modeled mass-radius relationships to analyze how bosonic dark matter admixture addresses specific observed radius anomalies</li><li>Identified instability thresholds in white dwarfs harboring attractive bosonic dark matter components, showing that the presence of an attractive core triggers catastrophic gravitational collapse</li><li>Probed asteroseismic signatures for white dwarfs admixing bosonic dark matter with density-dependent scattering lengths</li><li>Evaluated hydrostatic stability and hydrodynamic evolution of the admixed white dwarfs using a 1.5D framework under general relativity</li></ul>

- project: Addressing Missing Satellite Problem via Decyaing Dark Matter Halo
  duration: May &mdash; Jul 2021
  description: <a href="images/MSP.pdf" itemprop="url" target="_blank">Poster</a><br>Supervisor&#58; <a href="https://wp.phy.cuhk.edu.hk/teaching-staff/chu-ming-chung/" itemprop="url" target="_blank">Prof. M.-C. Chu</a><ul class="resume-item-list"><li>Generalized orbital parameters by extending the decaying dark matter in the halo model from initial circular orbits to eccentric trajectories across a range of orbital eccentricities</li><li>Simulated the dynamical time evolution of decaying dark matter halo density profiles to investigate the alleviation of the Missing Satellite Problem</li><li>Constrained decaying dark matter parameters by matching predicted satellite galaxy abundances with observational bounds from Milky Way dwarf spheroidals</li></ul>




